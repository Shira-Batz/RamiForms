        :root {
            --primary: #0284c7;
            --bg: #f8fafc;

        * {

        body {

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;

        h1 {

            margin-bottom: 20px;
            color: #1e293b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
            font-size: 14px;
            color: #475569;
        }

        input[type="text"],
        input[type="date"] {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .zip-option {
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 14px;
            margin-bottom: 12px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .instructions {
            font-size: 14px;
            background: #e0f2fe;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #0284c7;
            margin-top: 20px;
            line-height: 1.6;
        }

        .back {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;

        code {
            background: #bae6fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

    <!-- ספריות PDF -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.min.js"></script>
    <!-- אלגוריתם הכיווניות של יוניקוד (סידור טקסט מעורב עברית/מספרים/אנגלית) -->
    <script src="https://unpkg.com/bidi-js@1.0.3/dist/bidi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- מיקומי השדות בטפסים (נוצר ע"י tools/build_rami_fields.py) -->
    <script src="rami-fields.js?v=b13a849e"></script>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back">→ חזרה לדף הבית</a>
        <h1 id="pageTitle">מילוי אוטומטי של טפסי רמ"י</h1>

            3. <strong>חובה להפעיל את הקובץ דרך שרת מקומי</strong> (למשל תוסף Live Server ב-VS Code) כדי שהדפדפן יסכים

        <div class="grid">
            <div class="form-group"><label>שם פרטי 1</label><input type="text" id="firstName1"></div>
            <div class="form-group"><label>שם משפחה 1</label><input type="text" id="lastName1"></div>
            <div class="form-group"><label>תעודת זהות 1</label><input type="text" id="idNum1"></div>
            <div class="form-group"><label>שם פרטי 2</label><input type="text" id="firstName2"></div>
            <div class="form-group"><label>שם משפחה 2</label><input type="text" id="lastName2"></div>
            <div class="form-group"><label>תעודת זהות 2</label><input type="text" id="idNum2"></div>
            <div class="form-group"><label>מספר חוזה</label><input type="text" id="contractNum"></div>
            <div class="form-group"><label>יישוב</label><input type="text" id="city"></div>
            <div class="form-group"><label>רחוב</label><input type="text" id="street"></div>
            <div class="form-group"><label>מספר בית</label><input type="text" id="houseNum"></div>
            <div class="form-group"><label>מספר משק</label><input type="text" id="farmNum"></div>
            <div class="form-group"><label>ת.ד</label><input type="text" id="mailBox"></div>
            <div class="form-group"><label>מיקוד</label><input type="text" id="zipCode"></div>
            <div class="form-group"><label>גוש</label><input type="text" id="block"></div>
            <div class="form-group"><label>חלקה</label><input type="text" id="parcel"></div>
            <div class="form-group"><label>מגרש</label><input type="text" id="plot"></div>
            <div class="form-group"><label>תוכנית מפורטת</label><input type="text" id="plan"></div>
            <div class="form-group"><label>מרחב מטפל</label><input type="text" id="region"></div>
            <div class="form-group"><label>שטח חלקה (מ"ר)</label><input type="text" id="totalArea"></div>
            <div class="form-group"><label>שטח מגורים (מ"ר)</label><input type="text" id="livingArea"></div>
            <div class="form-group"><label>דואר אלקטרוני</label><input type="text" id="email" value="info@apv.co.il">
            </div>
            <div class="form-group"><label>תאריך (הצהרת בעלי זכויות)</label><input type="date" id="signDate"></div>
        </div>

        <label class="zip-option"><input type="checkbox" id="asZip"> הורדה כקובץ ZIP אחד במקום קבצים נפרדים</label>
        <button id="generateBtn" onclick="generatePDFs()">מלא והורד את כל הטפסים</button>
    </div>

    <script>
        // שני האתרים משתמשים באותו טופס ובאותן קואורדינטות, ההבדל הוא רק בקבצי ה-PDF
        const SITES = {
            dunam: { title: 'מילוי אוטומטי של טפסי רמ"י - דונם', folder: 'dunam', filePrefix: 'דונם_' },
            agro: { title: 'מילוי אוטומטי של טפסי רמ"י - אגרו', folder: 'agro', filePrefix: 'אגרו_' }
        };
        const site = SITES[new URLSearchParams(location.search).get('site')] || SITES.dunam;
        document.getElementById('signDate').value = new Date().toISOString().slice(0, 10); // ברירת מחדל: היום
        document.title = site.title;
        document.getElementById('pageTitle').innerText = site.title;

        const bidi = bidi_js();
        const HEBREW = /[\u0590-\u05FF]/;

        // ממיר טקסט מהסדר הלוגי (כפי שהוקלד) לסדר הוויזואלי משמאל לימין,
        // לפי אלגוריתם הכיווניות של יוניקוד: עברית מתהפכת, מספרים ואנגלית נשארים בכיוונם,
        // וסוגריים מתחלפים ( <-> ) בתוך הקטעים העבריים.
        function toVisual(str) {
            if (!HEBREW.test(str)) return str;
            const levels = bidi.getEmbeddingLevels(str, 'rtl');
            const chars = str.split('');
            bidi.getMirroredCharactersMap(str, levels.levels).forEach((ch, i) => { chars[i] = ch; });
            bidi.getReorderSegments(str, levels).forEach(([start, end]) => {
                chars.splice(start, end - start + 1, ...chars.slice(start, end + 1).reverse());
            });
            return chars.join('');
        }

        // fontkit הופך בעצמו את כל המחרוזת כשהאות הראשונה בה עברית (כולל המספרים - זה מקור הבאג).
        // לכן מציירים את הטקסט הוויזואלי בחלקים: חלק עברי (ללא אותיות לטיניות) נשלח הפוך
        // ו-fontkit מחזיר אותו לסדר הנכון, וחלק ללא עברית נשלח כמו שהוא.
        function drawVisualText(page, text, x, y, size, font, color) {
            const visual = toVisual(text);
            const chunks = visual.match(/[\u0590-\u05FF](?:[^A-Za-z\u00C0-\u024F]*[\u0590-\u05FF])?|[^\u0590-\u05FF]+/g) || [];
            for (const chunk of chunks) {
                const toDraw = HEBREW.test(chunk) ? [...chunk].reverse().join('') : chunk;
                page.drawText(toDraw, { x, y, size, font, color });
                x += font.widthOfTextAtSize(chunk, size);
            }
        }

        function withUnit(value, unit) {
            return value ? `${value} ${unit}` : '';
        }

        async function fetchLocalFile(filename) {
            const response = await fetch(filename, { cache: 'no-cache' }); // תמיד הגרסה העדכנית של הטפסים
            if (!response.ok) throw new Error(`לא הצלחנו לטעון את הקובץ: ${filename}`);
            return await response.arrayBuffer();
        }

        // כותב כל שדה ברווח הפנוי בתא שלו (לפי rami-fields.js): מיושר לימין, ומוקטן אם הוא ארוך מהתא
        async function fillForm(form, d, fontBytes) {
            const { PDFDocument, rgb } = PDFLib;
            const pdfDoc = await PDFDocument.load(await fetchLocalFile(`${site.folder}/${form.file}`));
            pdfDoc.registerFontkit(window.fontkit);
            const font = await pdfDoc.embedFont(fontBytes, { subset: true });
            const pages = pdfDoc.getPages();
            for (const field of form.fields) {
                const text = d[field.key];
                if (!text) continue;
                const room = field.x1 - field.x0;
                let size = 10;
                while (size > 6 && font.widthOfTextAtSize(text, size) > room) size -= 0.5;
                const width = font.widthOfTextAtSize(text, size);
                drawVisualText(pages[field.page], text, field.x1 - width, field.baseline, size, font, rgb(0, 0, 0));
            }
            return new Blob([await pdfDoc.save()], { type: 'application/pdf' });
        }

        function download(blob, name) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 10000);
        }

        async function generatePDFs() {
            const btn = document.getElementById('generateBtn');
            btn.innerText = 'מייצר טפסים... נא להמתין';
            btn.disabled = true;

            // כל שדה בטופס נשמר לפי ה-id שלו (d.city, d.street וכו')
            const d = {};
            document.querySelectorAll('.grid input').forEach(input => {
                d[input.id] = input.value.trim();
            });
            if (d.signDate) { // מהפורמט של הדפדפן (2026-10-15) לפורמט של הטופס (15/10/2026)
                const [y, m, day] = d.signDate.split('-');
                d.signDate = `${day}/${m}/${y}`;
            }
            d.fullName1 = `${d.firstName1} ${d.lastName1}`.trim();
            d.fullName2 = `${d.firstName2} ${d.lastName2}`.trim();
            d.applicantNames = [d.fullName1, d.fullName2].filter(Boolean).join(', ');
            d.totalArea = withUnit(d.totalArea, 'מ"ר');
            d.livingArea = withUnit(d.livingArea, 'מ"ר');

            const failed = [];
            const zip = document.getElementById('asZip').checked ? new JSZip() : null;
            try {
                const fontBytes = await fetchLocalFile('font.ttf');
                for (const form of RAMI_FORMS) {
                    try {
                        const blob = await fillForm(form, d, fontBytes);
                        const name = site.filePrefix + form.output;
                        if (zip) {
                            zip.file(name, blob);
                        } else {
                            download(blob, name);
                            await new Promise(r => setTimeout(r, 300)); // דפדפנים חוסמים לפעמים הורדות צמודות מדי
                        }
                    } catch (e) {
                        console.error(e);
                        failed.push(form.file);
                    }
                }
                if (zip) download(await zip.generateAsync({ type: 'blob' }), `${site.filePrefix}טפסים_ממולאים.zip`);
                alert(failed.length ? `לא הצלחנו להכין את: ${failed.join(', ')}` : 'הטפסים הוכנו והורדו.');
            } catch (error) {
                console.error(error);
                alert("אירעה שגיאה. פרטים ב-Console.");
            } finally {
                btn.innerText = 'מלא והורד את כל הטפסים';
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
