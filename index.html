<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מילוי טפסי רמ"י</title>
    <style>
        :root {
            --primary: #0284c7;
            --bg: #f8fafc;
            --surface: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 40px auto 0;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 30px;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .links a {
            display: block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 25px 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .links a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>מילוי אוטומטי של טפסי רמ"י</h1>
        <div class="links">
            <a href="form.html?site=rami">טפסי רמ"י</a>
            <a href="form.html?site=agro">טפסי אגרו</a>
        </div>
    </div>
</body>

</html>
